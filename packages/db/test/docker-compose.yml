services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: local-bootstrap-only
      POSTGRES_DB: hub
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      - hub

  pgbouncer:
    image: pgbouncer/pgbouncer:1.24.1
    entrypoint: ["/opt/pgbouncer/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    user: "70:70"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./.userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hub

networks:
  hub:
