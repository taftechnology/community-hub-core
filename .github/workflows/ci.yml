name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundary checks
        run: pnpm check:boundaries

      - name: Secret scanning
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Traceability
        if: github.event_name == 'pull_request'
        env:
          TRACEABILITY_BRANCH: ${{ github.head_ref }}
          TRACEABILITY_PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm exec tsx tooling/checks/traceability/check.ts

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and PgBouncer
        run: docker compose -f packages/db/test/docker-compose.yml up -d postgres
        # global-setup of @community-hub/db starts PgBouncer after writing userlist

      - name: Test
        run: pnpm test

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/bootstrap
          - infra/global
          - infra/regions/au
          - infra/modules/aws-network
          - infra/modules/aws-kms-storage
          - infra/modules/aws-rds
          - infra/modules/aws-ecs-tunnel
          - infra/modules/cf-tunnel
          - infra/modules/cf-vpc-service
          - infra/modules/cf-hyperdrive
          - infra/modules/cf-regional-hostname
          - infra/modules/cf-zone
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - uses: terraform-linters/setup-tflint@v4

      - name: Terraform checks
        working-directory: ${{ matrix.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform fmt -check
          terraform validate
          tflint --init
          tflint
          terraform test

  build-preview:
    name: build-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @community-hub/gateway... build

      - name: Wrangler deploy dry-run
        working-directory: apps/gateway
        run: pnpm exec wrangler deploy --dry-run

      - name: Require Cloudflare credentials
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required for preview upload"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID repository secret is required for preview upload"
            exit 1
          fi

      - name: Upload Worker version
        if: github.event_name == 'pull_request'
        id: upload
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload \
            --tag "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" \
            2>&1 | tee wrangler-upload.log
          PREVIEW_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler-upload.log | head -1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not find a *.workers.dev preview URL in wrangler output"
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `${{ steps.upload.outputs.preview_url }}`;
            const body = `## Gateway preview\n\nPreview URL: ${previewUrl}\n\nUploaded from commit ${context.sha.slice(0, 7)}.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
