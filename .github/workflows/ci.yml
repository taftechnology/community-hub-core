name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundary checks
        run: pnpm check:boundaries

      - name: Secret scanning
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Traceability
        if: github.event_name == 'pull_request'
        env:
          TRACEABILITY_BRANCH: ${{ github.head_ref }}
          TRACEABILITY_PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm exec tsx tooling/checks/traceability/check.ts

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and PgBouncer
        run: docker compose -f packages/db/test/docker-compose.yml up -d postgres
        # global-setup of @community-hub/db starts PgBouncer after writing userlist

      - name: Test
        run: pnpm test

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/bootstrap
          - infra/regions/au
          - infra/modules/aws-network
          - infra/modules/aws-kms-storage
          - infra/modules/aws-kms-envelope
          - infra/modules/aws-db-secrets
          - infra/modules/aws-budgets
          - infra/modules/aws-rds
          - infra/modules/aws-ingress
          - infra/modules/aws-admin-static
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - uses: terraform-linters/setup-tflint@v4

      - name: Terraform checks
        working-directory: ${{ matrix.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform fmt -check -recursive
          terraform validate
          tflint --init
          tflint
          terraform test

  build-preview:
    name: build-preview
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the ARM image
        run: docker build --platform linux/arm64 --provenance=false --sbom=false -f apps/api/Dockerfile -t community-hub-api:local .

      - name: Image contract checks
        env:
          RUN_IMAGE_TESTS: "1"
        run: pnpm --filter @community-hub/api exec vitest run --config vitest.config.ts src/image.test.ts

  publish:
    name: publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: [static, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: image-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Publish the image
        env:
          ECR_PUSH_ROLE_ARN: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          if [[ -z "${ECR_PUSH_ROLE_ARN:-}" || -z "${ECR_REGISTRY:-}" ]]; then
            echo "image publish secrets are empty" >&2
            exit 1
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws is not on PATH" >&2
            exit 1
          fi

          account_id="${ECR_REGISTRY%%.*}"
          echo "::add-mask::${account_id}"

          token_file="${RUNNER_TEMP}/github-oidc-token"
          response_file="${RUNNER_TEMP}/github-oidc-response"
          creds_file="${RUNNER_TEMP}/aws-creds"
          trap 'rm -f "${token_file}" "${response_file}" "${creds_file}"' EXIT
          curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            --output "${response_file}"
          node --input-type=module -e '
          import fs from "node:fs";
          const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          fs.writeFileSync(process.argv[2], response.value, { mode: 0o600 });
          ' "${response_file}" "${token_file}"
          rm -f "${response_file}"
          token="$(cat "${token_file}")"
          echo "::add-mask::${token}"
          node --input-type=module -e '
          import fs from "node:fs";
          const token = fs.readFileSync(process.argv[1], "utf8").trim();
          const payload = token.split(".")[1] ?? "";
          const claims = JSON.parse(Buffer.from(payload, "base64url").toString("utf8"));
          console.log(claims.sub);
          console.log(claims.ref);
          console.log(claims.job_workflow_ref);
          ' "${token_file}"

          aws sts assume-role-with-web-identity \
            --role-arn "${ECR_PUSH_ROLE_ARN}" \
            --role-session-name image-publish \
            --web-identity-token "${token}" \
            --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            --output text \
            --region ap-southeast-2 \
            > "${creds_file}"
          rm -f "${token_file}"
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN < "${creds_file}"
          rm -f "${creds_file}"
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          export AWS_DEFAULT_REGION=ap-southeast-2
          unset token

          repo="ch-staging/service"
          tag="${GITHUB_SHA}"
          image_query="[images[0].imageId.imageDigest, images[0].imageManifestMediaType, failures[0].failureCode]"
          read_image() {
            local result_file="${RUNNER_TEMP}/batch-get.json"
            aws ecr batch-get-image \
              --repository-name "${repo}" \
              --image-ids "imageTag=${tag}" \
              --query "${image_query}" \
              --output json \
              --region ap-southeast-2 \
              > "${result_file}"
            node --input-type=module -e '
            import fs from "node:fs";
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const digest = parsed[0];
            const mediaType = parsed[1];
            const failureCode = parsed[2];
            fs.writeFileSync(process.argv[2], typeof digest === "string" ? digest : "");
            fs.writeFileSync(process.argv[3], typeof mediaType === "string" ? mediaType : "");
            fs.writeFileSync(process.argv[4], typeof failureCode === "string" ? failureCode : "");
            ' "${result_file}" "${RUNNER_TEMP}/digest" "${RUNNER_TEMP}/media-type" "${RUNNER_TEMP}/failure-code"
            rm -f "${result_file}"
          }

          read_image
          digest="$(cat "${RUNNER_TEMP}/digest")"
          media_type="$(cat "${RUNNER_TEMP}/media-type")"
          failure_code="$(cat "${RUNNER_TEMP}/failure-code")"
          reused=0
          if [[ -n "${digest}" && "${failure_code}" != "ImageNotFound" ]]; then
            reused=1
          else
            pnpm install --frozen-lockfile
            docker build --platform linux/arm64 --provenance=false --sbom=false -f apps/api/Dockerfile -t community-hub-api:local .
            RUN_IMAGE_TESTS=1 pnpm --filter @community-hub/api exec vitest run --config vitest.config.ts src/image.test.ts
            aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin "${ECR_REGISTRY}" >/dev/null
            docker tag community-hub-api:local "${ECR_REGISTRY}/${repo}:${tag}"
            docker push "${ECR_REGISTRY}/${repo}:${tag}"
            read_image
            digest="$(cat "${RUNNER_TEMP}/digest")"
            media_type="$(cat "${RUNNER_TEMP}/media-type")"
          fi

          stdout_file="${RUNNER_TEMP}/scan-stdout"
          stderr_file="${RUNNER_TEMP}/scan-stderr"
          deadline=$((SECONDS + 600))
          while true; do
            set +e
            aws ecr describe-image-scan-findings \
              --repository-name "${repo}" \
              --image-id "imageDigest=${digest}" \
              --query "{status:imageScanStatus.status,counts:imageScanFindings.findingSeverityCounts}" \
              --output json \
              --region ap-southeast-2 \
              > "${stdout_file}" 2> "${stderr_file}"
            aws_exit=$?
            set -e
            timed_out_arg=""
            if (( SECONDS >= deadline )); then
              timed_out_arg="--timed-out"
            fi
            set +e
            node tooling/checks/image-publish/scan-decision-cli.js --stdout "${stdout_file}" --stderr "${stderr_file}" --aws-exit "${aws_exit}" --media-type "${media_type}" ${timed_out_arg}
            decision=$?
            set -e
            if (( decision == 0 )); then
              break
            fi
            if (( decision != 2 )); then
              node --input-type=module -e '
              import fs from "node:fs";
              import { errorNameFromStderr } from "./tooling/checks/image-publish/scan-decision.js";
              const digest = process.argv[1];
              let status = null;
              let counts = null;
              try {
                const parsed = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                if (parsed !== null && typeof parsed === "object" && !Array.isArray(parsed)) {
                  status = typeof parsed.status === "string" ? parsed.status : null;
                  counts = Object.hasOwn(parsed, "counts") ? parsed.counts : null;
                }
              } catch {
                status = null;
                counts = null;
              }
              const errorName = errorNameFromStderr(fs.readFileSync(process.argv[3], "utf8"));
              const mediaType = process.argv[5];
              const timedOut = process.argv[6] === "yes" ? "yes" : "no";
              const text = [
                "### Image publish",
                "Digest: " + digest,
                "Status: " + (status === null ? "null" : status),
                "Media type: " + mediaType,
                "Severity counts: " + JSON.stringify(counts ?? {}),
                "Error name: " + (errorName === null ? "null" : errorName),
                "Timed out: " + timedOut,
              ].join("\n");
              console.log(text);
              fs.appendFileSync(process.argv[4], text + "\n");
              ' "${digest}" "${stdout_file}" "${stderr_file}" "${GITHUB_STEP_SUMMARY}" "${media_type}" "${timed_out_arg:+yes}"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              exit 1
            fi
            sleep 15
          done

          {
            echo "### Image publish"
            if (( reused == 1 )); then
              echo "The tag was reused."
            fi
            echo "Digest: ${digest}"
            node --input-type=module -e '
            import fs from "node:fs";
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const counts = parsed.counts ?? {};
            console.log("Severity counts: " + JSON.stringify(counts));
            ' "${stdout_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

  admin-publish:
    name: admin-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: admin-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Publish the shell
        env:
          ADMIN_PUBLISH_ROLE_ARN: ${{ secrets.ADMIN_PUBLISH_ROLE_ARN }}
          ADMIN_BUCKET: ${{ secrets.ADMIN_BUCKET }}
          ADMIN_DISTRIBUTION_ID: ${{ secrets.ADMIN_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_PUBLISH_ROLE_ARN:-}" || -z "${ADMIN_BUCKET:-}" || -z "${ADMIN_DISTRIBUTION_ID:-}" ]]; then
            echo "admin publish secrets are empty" >&2
            exit 1
          fi
          command -v aws >/dev/null

          account_id="${ADMIN_PUBLISH_ROLE_ARN#arn:aws:iam::}"
          account_id="${account_id%%:*}"
          echo "::add-mask::${account_id}"

          pnpm install --frozen-lockfile
          pnpm --filter @community-hub/admin build

          token_file="${RUNNER_TEMP}/github-oidc-token"
          response_file="${RUNNER_TEMP}/github-oidc-response"
          creds_file="${RUNNER_TEMP}/aws-creds"
          trap 'rm -f "${token_file}" "${response_file}" "${creds_file}"' EXIT
          curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            --output "${response_file}"
          node --input-type=module -e '
          import fs from "node:fs";
          const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          fs.writeFileSync(process.argv[2], response.value, { mode: 0o600 });
          ' "${response_file}" "${token_file}"
          rm -f "${response_file}"
          token="$(cat "${token_file}")"
          echo "::add-mask::${token}"
          node --input-type=module -e '
          import fs from "node:fs";
          const token = fs.readFileSync(process.argv[1], "utf8").trim();
          const payload = token.split(".")[1] ?? "";
          const claims = JSON.parse(Buffer.from(payload, "base64url").toString("utf8"));
          console.log(claims.sub);
          console.log(claims.ref);
          console.log(claims.job_workflow_ref);
          ' "${token_file}"

          aws sts assume-role-with-web-identity \
            --role-arn "${ADMIN_PUBLISH_ROLE_ARN}" \
            --role-session-name admin-publish \
            --web-identity-token "${token}" \
            --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            --output text \
            --region ap-southeast-2 \
            > "${creds_file}"
          rm -f "${token_file}"
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN < "${creds_file}"
          rm -f "${creds_file}"
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          export AWS_DEFAULT_REGION=ap-southeast-2
          unset token

          aws s3 sync apps/admin/dist/assets "s3://${ADMIN_BUCKET}/assets" --delete --only-show-errors --cache-control "public, max-age=31536000, immutable" --region ap-southeast-2
          aws s3 cp apps/admin/dist/index.html "s3://${ADMIN_BUCKET}/index.html" --only-show-errors --cache-control "no-cache" --region ap-southeast-2
          aws cloudfront create-invalidation \
            --distribution-id "${ADMIN_DISTRIBUTION_ID}" \
            --paths "/" "/index.html" \
            --query "Invalidation.Id" \
            --output text \
            --region ap-southeast-2
